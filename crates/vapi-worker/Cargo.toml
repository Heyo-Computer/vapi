[package]
name = "vapi-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vapi-worker"
path = "src/main.rs"

[features]
default = []
# Pulls in candle + the FlashAttention CUDA build. Deliberately off by default:
# candle-flash-attn compiles FlashAttention from source, which takes tens of
# minutes and cannot build at all on a machine without nvcc.
cuda = []

[dependencies]
vapi-core.workspace = true
vapi-proto.workspace = true
vapi-cache.workspace = true
vapi-engine.workspace = true
vapi-tokenize.workspace = true
tokio.workspace = true
futures.workspace = true
async-nats.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
