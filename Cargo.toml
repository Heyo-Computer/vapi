[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# internal
vapi-core     = { path = "crates/vapi-core" }
vapi-openai   = { path = "crates/vapi-openai" }
vapi-proto    = { path = "crates/vapi-proto" }
vapi-tokenize = { path = "crates/vapi-tokenize" }
vapi-cache    = { path = "crates/vapi-cache" }
vapi-engine   = { path = "crates/vapi-engine" }
vapi-backend-candle = { path = "crates/vapi-backend-candle" }

# async runtime + http
tokio       = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = "0.1"
axum        = { version = "0.8", features = ["json"] }
tower-http  = { version = "0.7", features = ["trace", "cors"] }
futures     = "0.3"
async-nats  = "0.50"

# serde
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml       = "0.9"
bytes      = "1"

# util
thiserror  = "2"
anyhow     = "1"
uuid       = { version = "1", features = ["v4", "serde", "fast-rng"] }
blake3     = "1"
rand       = "0.10"
rand_chacha = "0.10"
parking_lot = "0.12"

# model / tokenization
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
minijinja  = { version = "2.24", features = ["loader", "preserve_order"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
metrics            = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# dev
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Fast iteration on this laptop: deps optimized, our crates not.
[profile.dev.package."*"]
opt-level = 2
