# NATS for local development.
#
# A config file rather than flags because `max_payload` has no command-line
# equivalent, and the default of 1 MB is too small for this project: a
# transcription job carries its audio inside the envelope, where a second of
# 16 kHz mono costs about 42 KB base64'd. 8 MB is a little over three
# minutes; the gateway refuses anything longer with a 413 rather than letting
# the publish fail inside the transport.

max_payload: 8MB

# The work queue and the KV buckets both need JetStream.
jetstream {
  store_dir: /data
}

# /varz, /jsz and /healthz.
http: 8222
